short_description: "사용자 노트북을 탐색합니다(인자 없음 → 인덱스). 한 노트북 안의 기록도 봅니다(notebook_id → 드릴다운)."
when_to_use: "편집 모드에서 `write_note` 전에 호출해서 유효한 record id를 확보하라. 사용자가 노트북을 설명으로만 말해서 정확한 id가 필요할 때, 여러 단계 저장을 계획할 때도 유용하다."
input_format: "인덱스는 {}. 한 노트북의 기록 목록은 {\"notebook_id\": \"시스템 프롬프트 노트북 목록의 id / 이전 인덱스 호출의 id\"}."
guideline: "인덱스는 id + 이름 + record_count를, 드릴다운은 기록 id + 제목 + 요약 + 날짜(최신순, ~80개 상한)를 보여준다. 시스템 프롬프트 매니페스트에 이미 보이는 노트북 이름을 확인하려고 호출하지 마라 — 진짜 새 정보가 필요할 때만 호출하라(예: 편집용 record id 탐색, 노트북 추가 후)."
note: "노트북이 하나라도 있을 때만 자동 마운트된다. 출력은 마크다운이라 chunk를 붙여넣어 사용자에게 인용할 수 있다."
phase: "exploration"
