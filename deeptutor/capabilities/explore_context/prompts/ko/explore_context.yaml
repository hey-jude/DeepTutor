user_template: |
  사용자의 현재 요청:
  {question}

  현재 모드: {mode}

  첨부 출처 목록(이름, 종류, id):
  {manifest}

  첨부 출처 전문:
  {sources}

  객관적 조사서를 지금 써라.

briefing_header: |
  [맥락 조사]
  조사관이 이번 턴에 사용자가 첨부한 자료를 현재 작업 중심으로 살펴봤다.
  다음은 근거용 객관적 3인칭 서술이다. 아래 언급되는 대화 전사는 사용자와 다른
  에이전트의 교환이지 당신 자신의 작업이 아니다. 그 목소리를 빌리거나 그 행동을
  주장하지 마라.

status:
  exploring: "맥락 탐색 중"
