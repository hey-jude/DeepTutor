short_description: "첨부 지식베이스가 가진 문서 목록을 총 개수와 함께 보여줍니다."
when_to_use: "내용이 아니라 지식베이스 자체에 대한 질문에 씁니다 — 파일이 몇 개인지, 이름이 무엇인지, 특정 문서가 있는지, 무엇을 올렸는지."
input_format: "{\"kb_name\": \"첨부 지식베이스 이름 중 하나\", \"pattern\": \"선택 '*.pdf' 같은 glob이나 부분 문자열\", \"limit\": \"선택 최대 개수\"}."
guideline: "개수·파일 존재 질문에 rag 구절로 답하지 마라 — 검색은 매칭된 것만 보여주고 컬렉션 크기는 말해주지 않는다. 개수는 시스템 프롬프트 지식베이스 인벤토리에 이미 있다. 전체 목록이나 이름 필터가 필요하면 이 도구를 호출하라."
note: "개수는 지식베이스에 저장된 파일 기준이다. 인덱스가 아직 안 된 지식베이스도 문서는 목록에 나온다. 원격 서버 지식베이스는 목록을 못 가져온다 — 어느 쪽이든 주어진 대로 보고하라."
phase: "exploration"
