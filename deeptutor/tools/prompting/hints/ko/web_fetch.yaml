short_description: "특정 URL을 가져와 읽을 수 있는 내용을 마크다운으로 추출합니다."
when_to_use: "사용자 메시지에 특정 URL이 있고 그 페이지를 읽어야 할 때 씁니다. 그것에 대한 질문이 붙은 공유 블로그/교과서/논문 링크, 명시적 '이 페이지 읽어줘' 요청. 일반 주제 검색은 ``web_search``를 써라."
input_format: "{\"url\": \"전체 http(s):// URL\", \"max_chars\": 50000}. ``max_chars``는 선택(기본 50000)이며 초과분은 잘린다."
guideline: "로그인 장벽, 안티봇, JS 전용 페이지는 쓸 만한 내용이 거의 없을 수 있다 — 솔직히 그렇게 말하고, 빈 결과를 둘러대며 지어내지 마라. 반환 텍스트는 스크립트·사이드바가 이미 제거돼 있다(있으면 첫 줄이 `# 제목`)."
note: "file://, localhost, 사설 IP는 거부한다. 호출당 URL 하나씩 가져온다. 여러 URL이면 호출을 나눠라."
phase: "exploration"
