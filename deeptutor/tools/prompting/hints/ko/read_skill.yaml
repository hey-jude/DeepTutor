short_description: "스킬의 전체 플레이북(SKILL.md)이나 스킬 패키지 안의 참고 파일을 읽습니다."
when_to_use: "현재 작업이 지시문의 스킬 섹션에 나열된 스킬과 맞을 때 씁니다. 작업 시도 전에 스킬을 먼저 읽고 지시를 따라라."
input_format: "`name` — 목록 그대로의 스킬 이름. 선택 `file` — 패키지 안 경로(예: `references/api.md`). 기본값 SKILL.md."
guideline: "당면 작업과 관련된 스킬만 읽어라. SKILL.md가 필요한 변형용 references/ 파일을 링크하면 그 파일도 행동 전에 읽어라."
note: "매니페스트에 `(unavailable: ...)` 표시된 스킬은 요구 충족 전까지 쓸 수 없다 — 추측하지 말고 그렇게 말하라."
phase: "exploration"
