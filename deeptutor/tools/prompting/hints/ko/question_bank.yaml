short_description: "학습자의 문제 은행 — Learning Space → Question Bank 아래 채점된 퀴즈 문제 — 을 읽고 정리합니다. 노트북이 아닙니다."
when_to_use: "학습자가 자기 문제, 오답, 실수, 문제 세트/문항 모음을 말할 때 씁니다. 복습, 묶기, 세트에 넣기, 정리하기. action='overview'(개수 + 기존 카테고리명)로 시작하고, action='list'로 entry id를 가져오고, action='organize'로 카테고리명에 넣어라. `write_note`를 쓰지 마라 — 노트는 산문이고 뱅크는 채점 문제다. 실수를 노트북에 넣는 건 잘못된 저장소다."
input_format: "overview: {\"action\": \"overview\"}. list: {\"action\": \"list\", \"filter\": \"wrong\" | \"uncategorized\" | \"bookmarked\" | \"all\", \"category\": 선택 이름, \"search\": 선택 텍스트, \"limit\": 선택}. organize / unfile: {\"action\": \"organize\", \"entry_ids\": [12, 15], \"category\": \"미적분 실수\"}. bookmark: {\"action\": \"bookmark\", \"entry_ids\": [12], \"bookmarked\": true}."
guideline: "`entry_ids`는 `list` 호출이 [대괄호]로 보여준 숫자다 — 지어내지 말고 항상 먼저 list하라. `organize`는 이름이 새로우면 카테고리를 만든다. 따라서 새 세트에 실수를 넣는 요청은 create-then-file이 아니라 organize 한 번이다. 이미 맞는 기존 카테고리명은 그대로 재사용하고(overview에 나온다) 비슷하게 새로 만들지 마라. filter='uncategorized'는 분류함 — '문제 은행 정리해줘'의 올바른 출발점이다."
note: "뱅크에 실제 항목이 있을 때만 자동 마운트된다. 변경은 즉시 반영된다. 학습자는 Learning Space → Question Bank에서 바로 본다. 실제 일어난 일을 보고하라 — 몇 개가 들어갔고 새 카테고리가 생겼는지 결과에 나온다."
phase: "synthesis"
