short_description: "한 번의 LLM 호출로 주제에 대한 여러 가능한 방향을 탐색합니다."
when_to_use: "해결책에 커밋하기 전에 넓은 아이디어 탐색, 대안 각도, 초기 단계 옵션 생성이 필요할 때 씁니다."
input_format: "자연어 주제나 목표, 그리고 선택 맥락이나 제약."
guideline: "깊은 연역보다 폭이 중요할 때, 가벼운 근거가 붙은 여러 실행 가능 방향이 필요할 때 브레인스토밍을 우선하라."
note: "좋은 프롬프트에는 목표, 대상, 제약, 어떤 아이디어가 가장 유용할지가 들어간다."
phase: "ideation"
