short_description: "확장 도구(MCP 서버 도구 등)를 로드해 이 세션에서 호출 가능하게 합니다."
when_to_use: "아직 로드 안 된 확장 도구 섹션의 도구가 작업에 필요할 때 씁니다. 로드 전에 확장 도구를 호출하면 실패합니다."
input_format: "`names` — 확장 도구 섹션의 정확한 도구 이름 배열."
guideline: "현재 작업에 필요한 도구만 로드하라 — 목록 전체가 아니다. 로드된 도구는 세션 끝까지 유지된다. 다시 로드하지 마라."
note: "알 수 없다고 나오면 확장 도구 섹션에서 정확한 철자를 다시 확인하라."
phase: "exploration"
