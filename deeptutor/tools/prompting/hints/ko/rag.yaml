short_description: "첨부 지식베이스 중 하나에서 관련 구절을 검색합니다."
when_to_use: "첨부 지식베이스가 답을 커버할 것 같을 때 씁니다 — 정의, 공식, 개념, 교과서 설명."
input_format: "{\"query\": \"비어 있지 않은 자연어 쿼리\", \"kb_name\": \"첨부 지식베이스 이름 중 하나\"}."
guideline: "과목 일치 작업은 외부 검색보다 RAG를 우선하라. 지식베이스 여러 개를 볼 때는 kb_name마다 rag를 한 번씩 호출하라(시스템이 병렬 실행한다)."
note: "쿼리는 비어 있으면 안 된다. 첫 검색이 약하면 다른 각도로 쿼리를 고쳐보고 포기하라."
phase: "exploration"
