short_description: "수학 문제 이미지를 분석해 검증된 GeoGebra 명령을 만들고 기하 시각화를 합니다."
when_to_use: "사용자가 기하·수학 도표를 올리고 GeoGebra에서 도형을 재구성·시각화·조작하고 싶을 때 씁니다."
input_format: "수학 문제 텍스트(질문). 이미지는 첨부에서 자동 주입된다."
guideline: "이미지 첨부가 있고 기하 도형이 얽힌 문제에만 호출하라. 도구는 4단계 파이프라인(검출 → 분석 → 스크립팅 → 성찰)을 돌려 바로 렌더 가능한 GeoGebra 명령을 반환한다. 도구 결과에 ```ggbscript[…]``` 펜스 블록이 있으면 통째로 그대로 최종 답에 복사해서 채팅 화면이 인터랙티브 도형을 렌더하게 하라."
note: "파이프라인에 비전 가능 LLM이 필요하다. 순차 LLM 4회 호출이라 15-30초 걸릴 수 있다."
phase: "exploration"
