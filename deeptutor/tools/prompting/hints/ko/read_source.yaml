short_description: "매니페스트 id로 첨부 출처(노트북 기록, 책 페이지, 히스토리 세션, 문제 은행 항목, 문서 첨부)의 전문을 읽습니다."
when_to_use: "\"첨부 출처\" 매니페스트의 미리보기로 사용자 질문에 답하기에 부족할 때만 호출하라. 미리보기가 이미 커버하면 다시 가져오지 마라."
input_format: "{\"source_id\": \"매니페스트 그대로의 정확한 id(예: nb-... / bk-... / hs-... / qb-... / at-...)\"}."
guideline: "source_id는 매니페스트에서 그대로 복사하라 — 지어내거나 추측하지 마라. 호출당 출처 하나씩 읽어라. 여러 개 필요하면 호출을 나눠라."
note: "첨부 출처가 없으면 이 도구는 나타나지 않는다. \"어떤 자료요?\"라고 사용자에게 되묻지 마라."
phase: "exploration"
