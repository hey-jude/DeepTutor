short_description: "이미 있는 학습 대화 하나를 다시 여는 카드(첫 메시지 포함)를 학습자에게 건넵니다."
when_to_use: "하던 주제를 이어가려 할 때 씁니다. mastery_sessions에서 session_id가 필요합니다."
input_format: "{\"path_id\": \"...\", \"session_id\": \"...\", \"opening_message\": \"학습자 목소리의 첫 메시지\", \"module\": \"선택 레슨 id/이름/번호\", \"reason\": \"왜 지금인지 한 줄\"}"
guideline: "첫 메시지는 학습자가 직접 칠 법하게, 학습자 언어로 쓰고, 요청한 레슨을 지목하라 — 반대편 튜터가 가르칠 내용을 정하기 전에 읽는다. 그리고 거기서 뭘 볼지 한 문장으로 말하라. 버튼을 설명하지 마라. 열고 있다고 주장하지 마라. 이 채팅에서 주제 지도를 시작하지 마라."
note: "학습자가 클릭하는 카드를 만든다. 저절로 이동하지 않고 진도도 안 바뀐다. id는 먼저 검증되므로 존재하지 않는 레슨·대화를 가리키는 카드가 나올 수 없다."
phase: "synthesis"
