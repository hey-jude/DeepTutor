short_description: "명시적 사용자 선호를 장기 메모리에 저장합니다. 사용자가 선호를 *분명히* 말했을 때만 발동합니다."
when_to_use: "사용자가 선호를 명시적으로 말했다 — 스타일, 언어, 형식, 깊이, 후속 주기, 앞으로 이어가고 싶은 것. 추측하지 마라. 상황적일 수 있는 한 마디에서 추론하지 마라."
input_format: "{\"op\": \"add\"|\"edit\", \"text\": \"사용자 말 그대로 ≤240자\", \"target_id\"?: \"edit용 m_xxx\", \"reason\"?: \"선택 메모\"}"
guideline: "답에 선호를 간단히 되받아치고('알겠습니다 — 앞으로 간결하게'), 이걸 호출하라. 자연스러우면 사용자 말을 「그대로」 인용하라. 선호 하나당 한 번 호출. 무관한 선호를 한 text에 묶지 마라."
note: "L3 선호 문서에 쓴다. 다른 메모리 층(최근, 프로필, 범위, 표면별 요약)은 Memory workbench에서 사용자가 직접 통합한다 — 거기에 쓰려 하지 마라."
phase: "execution"
