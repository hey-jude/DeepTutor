short_description: "설정된 이미지 생성 서비스로 원본 이미지를 만들고 활성 워크스페이스 outputs/ 아래에 저장합니다."
when_to_use: "일러스트, 아트워크, 컨셉 이미지, 포스터, 포토리얼 장면 같은 생성형 비주얼 요청에 씁니다. 프로그래밍 방식 차트·도표·이미지 후처리는 exec를 써라."
input_format: "생생하고 자족적인 프롬프트. 선택으로 size와 n(1-4)."
guideline: "원본 비주얼 미디어는 imagegen을 직접 호출하라. 파일을 저장하고 정확한 워크스페이스 상대 경로를 반환하지만 자동으로 보여주지는 않는다. 그 경로를 Markdown에 복사하기 전에 각 반환 경로로 workspace_present를 호출하라. 제공자 URL이나 호스트 파일시스템 경로는 노출하지 마라."
phase: "synthesis"
