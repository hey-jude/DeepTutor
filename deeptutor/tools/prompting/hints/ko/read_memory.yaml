short_description: "사용자 영속 메모리를 읽습니다. 최근 학습 요약, 프로필, 지식 범위, 명시 선호."
when_to_use: "이 사용자에게 어조·깊이·예시·추천을 맞추면 답이 의미 있게 달라질 때 씁니다. 순수 사실/계산/번역 질문은 건너뛰어라."
input_format: "파라미터 없음. 4개 L3 문서를 이어붙여 반환한다."
guideline: "턴당 최대 한 번 호출하라. 메모리는 어떻게 설명할지를 빚는 데 써라 — 예시, 깊이, 후속 질문. 메모리를 사실 내용인 양 사용자에게 그대로 인용하지 마라."
note: "메모리가 아직 없으면 `(No memory available...)` 안내가 온다 — 일반 질문으로 다뤄라."
phase: "exploration"
