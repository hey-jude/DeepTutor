short_description: "루프를 멈추고 한 장의 카드로 사용자에게 1-4개 명확화 질문을 합니다. 각 질문은 2-4개 클릭 옵션(라벨 + 설명)과 자동 자유 입력이 붙습니다."
when_to_use: "진짜로 사용자가 정해야 하는 결정에 막혔을 때만 — 요청, 대화, 첨부 자료, 합리적 기본값으로 해결할 수 없는 것(예: 사용자 수준/학년이 깊이를 바꾸는 경우, 질문 지시어가 모호한 경우, 합리적인 여러 경로가 실질적으로 갈리는 경우). \"진행할까요?\"라고 묻거나, 사용자가 이미 말한 것을 확인하거나, 뻔한 관례 답이 있는 선택에 호출하지 마라 — 그 답을 골라 응답에 밝히고 진행하라. **한 어시스턴트 메시지당 `ask_user` 최대 한 번**: 모든 명확화를 그 한 번의 호출의 `questions` 목록(최대 4개)에 묶어라. 병렬 `ask_user` tool_call을 여러 개 내보내지 마라 — 중복 카드는 여유가 아니라 버그다."
input_format: |
  {"intro": "선택 한 줄 리드인", "questions": [
    {"id": "audience", "header": "대상", "prompt": "이 발표의 대상은 누구인가요?",
     "options": [
       {"label": "경영진 (권장)", "description": "결론 우선, 간결하게"},
       {"label": "엔지니어링 팀", "description": "기술 상세와 구현"},
       {"label": "외부 고객", "description": "가치 제안, polished 비주얼"}
     ]},
    {"id": "focus", "header": "범위", "prompt": "어떤 영역을 다룰까요?", "multi_select": true,
     "options": [{"label": "결과"}, {"label": "방법론"}, {"label": "다음 단계"}]}
  ]}
  규칙: 질문마다 2-4개의 distinct하고 상호 배타적인 옵션 — `label`은 짧게(1-5 단어), `description`은 그것을 고르면 뭔지 설명. 권장 옵션이 있으면 맨 앞에 두고 라벨에 " (권장)"을 붙여라. 선택지가 조합 가능하면 `multi_select: true`로 하고 질문도 그에 맞게 써라. `header`는 아주 짧은 탭 라벨(최대 12자). "기타" 옵션을 직접 추가하지 마라 — 카드는 자유 입력을 자동으로 제공한다.
guideline: "이 호출 뒤에 루프는 사용자가 답할 때까지 **멈췄다가** 같은 턴에 **이어진다**. 사용자 답은 ``User answered:``로 시작하고 질문마다 ``- <prompt>\\n  → <answer>`` 한 줄씩 붙은 매칭 도구 결과로 온다(복수 선택 답은 쉼표 연결). 그걸 보면 원래 요청을 반드시 이어가라 — 필요하면 도구를 더 호출하고, 실질 ``FINISH``로 끝내라. ask_user를 턴의 끝으로 **취급하지 마라** — 한 줄 확인 인사는 허용되는 최종 답이 아니다."
note: "건너뛴 질문은 ``(skipped)``로 온다. 사용자는 옵션 대신 자유 텍스트로 답할 수 있다 — 권위 있는 답으로 다뤄라. 정지 버튼으로 멈춤을 취소할 수도 있다(턴 전체 취소)."
phase: "exploration"
