short_description: "학습자에게 주제 학습 대화를 시작하는 카드(첫 메시지 포함)를 건넵니다."
when_to_use: "주제로 작업하려는데 맞는 기존 대화가 없을 때 — 새로운 각도, 한 레슨 복습, 대화가 아직 없는 주제."
input_format: "{\"path_id\": \"...\", \"opening_message\": \"학습자 목소리의 첫 메시지\", \"module\": \"선택 레슨 id/이름/번호\", \"reason\": \"왜 지금인지 한 줄\"}"
guideline: "mastery_open_session과 같은 규칙: 첫 메시지는 학습자 목소리로 쓰고 요청한 레슨을 지목한다. 주제의 진도는 그대로 유지되고 대화만 새로워지므로, 처음부터 다시 시작한다고 경고하지 말고 그렇게 말하라."
note: "학습자가 클릭하는 카드를 만든다. 저절로 이동하지 않고 진도도 안 바뀐다."
phase: "synthesis"
